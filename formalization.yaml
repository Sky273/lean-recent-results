version: "v0.4"

project:
  name: "RecentResults: machine-checked verification of six recent mathematical results"
  description: >-
    Lean 4 / Mathlib verifications of six results that appeared in 2025-2026, several of them
    found with AI systems: (1) Noel's counterexample to the List Total Colouring Conjecture
    (a cubic graph on 20 vertices with total chromatic number 4 that is not totally
    4-choosable); (2) Noel's counterexample to the Albertson-Grossman-Haas partial list
    colouring conjecture (14 vertices), which also refutes Iradmusa's ratio conjecture;
    (3) an additive complement of the squares with limsup |A cap [1,N]|/sqrt(N) <= 13 sqrt(2)/4
    (Erdos problem 33, upper bound only); (4) Park's proof that the Fibonacci numbers are not an
    additive uniqueness set for multiplicative functions, with his general criterion;
    (5) cycles of length 4 or 8 in graphs of diameter <= 2 and minimum degree >= 3 (Carr), and of
    diameter <= 3 and minimum degree >= 4 (an AI-produced proof claim; partial progress on Erdos
    problem 64); (6) Xu's strengthened Bukh-van Hintum-Keevash bound |B| >= n + C(t+1,2) with
    sharpness.
  authors: ["Claude (Anthropic), directed by Luc Moreau"]
  responsible_maintainers: ["Luc Moreau"]
  license: "Apache-2.0"

sources:
  - title: "The List Total Colouring Conjecture is False"
    authors: ["Jonathan A. Noel"]
    contributors:
      - name: "ChatGPT 6 Astra Ultra"
        role: "found the counterexample; drafts of the arguments (per the paper's AI declaration)"
    id: "arXiv:2609.38417"
    type: "article"
    location: "Theorem 1.1 (v2, 2026-10-09)"
    relationship: "formalizes"
    note: >-
      The lower half of Theorem 1.1 (chi'' = 4 and not totally 4-choosable) and the refutation
      of the conjecture are formalized. The upper bound chi''_l <= 5, which the paper takes from
      Juvan-Mohar-Skrekovski (1998, Theorem 3.1), is not.
    author_endorsement: "not-contacted"
  - title: "The Partial List Colouring Conjecture is False"
    authors: ["Jonathan A. Noel"]
    contributors:
      - name: "ChatGPT 6 Astra Ultra"
        role: "found the counterexample and the proof (per the paper's AI declaration)"
    id: "arXiv:2609.23291"
    type: "article"
    location: "Theorem 1.1 (v1, 2026-09-20)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Erdos problem 33: forum post #8879 (upper bound 13 sqrt(2)/4)"
    contributors:
      - name: "donteatllamas"
        role: "forum user who posted the construction, made with the help of GPT"
      - name: "Paul Erdos"
        role: "problem proposer"
    id: "https://www.erdosproblems.com/forum/thread/33#post-8879"
    type: "web post"
    location: "write-up linked from the post: https://github.com/LeanMeanBean/erdos-33"
    relationship: "formalizes"
    note: "Unsigned write-up; no review recorded in the thread."
    author_endorsement: "not-contacted"
  - title: "The Fibonacci numbers are not an additive uniqueness set for multiplicative functions"
    authors: ["Poo-Sung Park"]
    contributors:
      - name: "ChatGPT (OpenAI GPT-6 Astra)"
        role: "proposed the switching construction and ran the search (per the paper, Section 6)"
    id: "arXiv:2609.08137"
    type: "article"
    location: "Theorem 2.1, Proposition 3.1, Theorem 4.1 (v1, 2026-09-08)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Cycles of Length 4 or 8 in Graphs with Diameter 2 and Minimum Degree at Least 3"
    authors: ["Avery Carr"]
    id: "arXiv:2508.19302"
    type: "article"
    location: "Theorem 1.1 (v4, 2026-01-30)"
    relationship: "formalizes"
    note: "The Lean proof restructures Case 2 (it splits on whether the base edge lies in a triangle)."
    author_endorsement: "not-contacted"
  - title: "Erdos problem 64, proof claim #383: minimum degree >= 4 and diameter <= 3 give a 4- or 8-cycle"
    contributors:
      - name: "Murat Can Temeller"
        role: "claimant on erdosproblems.com (proof claim #383)"
      - name: "Claude Opus 5.5 (Anthropic)"
        role: "produced the theorem, proof, code and computations (per the GitHub issue)"
    id: "https://github.com/zey9310/zey9310-math/issues/1"
    type: "web post"
    location: "https://www.erdosproblems.com/forum/thread/64/proof-claims (claim #383, 2026-10-02)"
    relationship: "formalizes"
    note: "The issue's computer searches are not formalized."
    author_endorsement: "not-contacted"
  - title: "Solution of the strengthened Bukh-van Hintum-Keevash conjecture on additive bases"
    authors: ["Zixiang Xu"]
    id: "arXiv:2605.10771"
    type: "article"
    location: "Theorem 1.1, sharpness construction, Corollary 1.2, Lemma 2.2 (v1, 2026-05-11)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/plby/lean-proofs (src/latest/BorisBukh/BasisSubset.lean)"
    relationship: "independent"
    note: >-
      B. Alexeev's earlier proof (2026-07-27) of the sum form |A| + |B| >= 2n over R^n, which
      implies result 6 for t <= 1; its statement is re-derived from ours.
  - id: "https://github.com/facebookresearch/atlas-lean/tree/8920030e01896f93ad131e164cc11f98c91a44d8"
    relationship: "other"
    note: >-
      atlas-lean lists the AGH and Iradmusa partial list colouring conjectures as unproved
      theorem_wanted targets; their statements are copied and proved false here (result 2).
  - id: "https://github.com/google-deepmind/formal-conjectures/tree/2a315101d438a68c0ebdf22b7485ac731624efed"
    relationship: "other"
    note: >-
      Definitions IsKChoosable / listChromaticNumber and the Erdos 33 statements are copied
      verbatim from formal-conjectures, where the vanDoorn variant of Erdos 33 had no proof.

