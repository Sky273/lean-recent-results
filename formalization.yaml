automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Multi-agent workflows: prior-art search (Mathlib PR titles, Zulip archive to
        2026-09-25, formal-conjectures, plby/lean-proofs, openai/math, Palomar, GitHub code
        search); one assessment agent per candidate result, which also wrote the formalization;
        an adversarial agent per candidate; blind restatement of every result from its source by
        an agent that had not seen the formalization (Fidelity/Blind), then Lean proofs of the
        blind statements from ours (Fidelity/); a referee-style and a Lean-expert review per
        result, each serious finding re-checked by a refuting agent; then Comparator challenges.
      cost:
        wall_time: "about two days (2026-10-21 to 2026-10-22)"
        spend_usd: "not tracked"
        hardware: "API-only agents; a Windows laptop for local builds; GitHub Actions for Comparator"
      prompting_notes: >-
        The human (a computer scientist, not a mathematician) set the goals and the publication
        policy (transparency; no overclaiming; nothing sent to researchers without review) and
        approved each publication step. All Lean code, statements and documentation were written
        by the AI agents.
  spend_usd: "not tracked"
  notes: >-
    Statements were checked by Comparator (challenge files in Challenges/, configs in
    comparator/), run in CI with --paranoid, and every module is replayed with leanchecker.

fidelity:
  divergences: >-
    Noel LTCC: the upper bound chi''_l <= 5 is not formalized; the final step is a kernel
    decide over 256 cases instead of the paper's common-colour argument. Noel PLCC: the trivial
    case l = k is omitted from the conjecture (the refuted statement is weaker, the refutation
    stronger). Erdos 33: coverage is proved for every natural number, not only large ones; the
    vanDoorn variant is derived from the new bound. Park: the key lemma and the criterion hold
    for all n, m >= 0 and without p != q. Erdos 64: ediam <= 2 weakens Carr's diameter = 2; the
    proof of Carr's theorem restructures his Case 2. Xu: a rank-nullity argument replaces the
    forest-contraction count; Lemma 2.2 is split into a folding step and a sharper F_2^n case.
    See AUDIT.md for details.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    No human mathematician has reviewed these formalizations. Review consisted of the blind
    fidelity checks (Fidelity/), adversarial and referee-style AI reviews, Comparator, and
    leanchecker. AUDIT.md lists, for every result, the source claim, the Lean statement, the
    self-written definitions and what is not verified.

alignment:
  namespace: "NoelLTCC, Noel, Erdos33, FibSpiro, FibCrit, Erdos64Diam, XuBvHK"
  statements:
    - source: "Noel, arXiv:2609.38417, Theorem 1.1 (chi'' = 4, chi''_l >= 5) and LTCC refutation"
      lean: "NoelLTCC.exists_cubic_totalChromatic_four_not_totalChoosable_four, NoelLTCC.list_total_colouring_conjecture_false"
      module: "RecentResults.NoelListTotalColouring"
      status: "proved"
    - source: "Noel, arXiv:2609.38417, Theorem 1.1 (chi''_l <= 5, from Juvan-Mohar-Skrekovski)"
      lean: ""
      module: ""
      status: "not-formalized"
    - source: "Noel, arXiv:2609.23291, Theorem 1.1 and AGH refutation"
      lean: "Noel.main, Noel.not_AGH"
      module: "RecentResults.NoelPartialListColouring"
      status: "proved"
    - source: "Erdos 33, forum post #8879: limsup <= 13 sqrt(2)/4"
      lean: "Erdos33.erdos_33_le_13_sqrt2_div_4"
      module: "RecentResults.Erdos33"
      status: "proved"
    - source: "Park, arXiv:2609.08137, main theorem and Theorem 4.1"
      lean: "FibSpiro.not_isAUSet_posFib, FibSpiro.exists_nat_counterexample, FibCrit.criterion"
      module: "RecentResults.ParkFibonacci"
      status: "proved"
    - source: "Carr, arXiv:2508.19302, Theorem 1.1"
      lean: "Erdos64Diam.carr_diam2"
      module: "RecentResults.Erdos64SmallDiameter"
      status: "proved"
    - source: "Erdos 64 proof claim #383 (diameter <= 3, minimum degree >= 4)"
      lean: "Erdos64Diam.diam3_minDegree4"
      module: "RecentResults.Erdos64SmallDiameter"
      status: "proved"
    - source: "Xu, arXiv:2605.10771, Theorem 1.1, sharpness, Corollary 1.2"
      lean: "XuBvHK.theorem_1_1, XuBvHK.theorem_1_1_sharp, XuBvHK.corollary_1_2"
      module: "RecentResults.XuAdditiveBases"
      status: "proved"

